name: track

on:
  schedule:
    # Every 10 minutes. GitHub queues scheduled jobs, so expect 10-20 minutes
    # in practice on a busy hour. Five is the documented floor.
    - cron: "*/10 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["ads-drop/**", "config.json"]

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        run: node src/collect.mjs

      - name: Build dashboard
        run: node src/build.mjs

      - name: Commit data
        run: |
          git config user.name  "roblox-tracker"
          git config user.email "actions@github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # another run may have landed while this one was working
            git pull --rebase --autostash origin main || true
            git push
          fi
